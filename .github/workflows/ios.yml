name: iOS 构建

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          echo "👉 生成 Xcode 工程..."
          xcodegen generate
          echo "✅ 生成完毕"

      - name: 构建模拟器版本
        run: |
          echo "👉 开始编译..."
          
          # 关闭 errexit，但不使用管道，直接重定向到日志文件，确保退出码能正确捕获
          set +e
          xcodebuild \
            -project SSHBlack.xcodeproj \
            -scheme SSHBlack \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO > build_log.txt 2>&1
          EXIT_CODE=$?
          set -e
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "🎉 构建成功！"
          else
            echo "========================================"
            echo "❌ 构建失败！以下是错误摘要及上下文："
            echo "========================================"
            grep -n -B 5 -A 5 "error:" build_log.txt | tail -n 100
            echo "========================================"
            echo "👉 请截图以上报错信息。"
            exit 1
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SSHBlack-模拟器版
          path: build/Build/Products/Release-iphonesimulator/SSHBlack.app
