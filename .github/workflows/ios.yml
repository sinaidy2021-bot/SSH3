name: iOS 构建

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: 下载中英文等宽字体
        run: |
          mkdir -p Sources/SSHBlack/Fonts
          brew install p7zip
          # 同时尝试两个 release URL，任一成功即可
          (curl -fL -o /tmp/sarasa.7z "https://github.com/be5invis/Sarasa-Gothic/releases/download/v1.0.29/SarasaMonoSC-TTF-1.0.29.7z" \
            || curl -fL -o /tmp/sarasa.7z "https://github.com/be5invis/Sarasa-Gothic/releases/download/v1.0.29/SarasaMonoSC-TTF-1.0.29.7z") \
            && 7z x /tmp/sarasa.7z -o/tmp/sarasa/ -y \
            && find /tmp/sarasa -name "*.ttf" -exec cp {} Sources/SSHBlack/Fonts/ \;
          ls -la Sources/SSHBlack/Fonts/ || true

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 构建真机 IPA
        run: |
          set +e
          xcodebuild archive \
            -project SSHBlack.xcodeproj \
            -scheme SSHBlack \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SSHBlack.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -skipPackagePluginValidation -skipMacroValidation > build_log.txt 2>&1
          CODE=$?
          set -e
          if [ $CODE -ne 0 ]; then
            echo "❌ 编译失败"; grep -n -B 3 -A 3 "error:" build_log.txt | tail -n 80; exit 1
          fi
          mkdir -p build/Payload
          cp -R build/SSHBlack.xcarchive/Products/Applications/SSHBlack.app build/Payload/
          cd build && zip -r SSHBlack-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SSHBlack-未签名IPA
          path: build/SSHBlack-unsigned.ipa
