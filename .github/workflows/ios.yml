name: iOS 构建

on:
  workflow_dispatch:  # 只有手动点击才会构建，改文件不会乱跑

jobs:
  build:
    runs-on: macos-15   # 👈 关键修复：使用最新的 macOS 15，自带 Xcode 16，完美兼容新格式

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          echo "👉 正在生成 Xcode 工程文件..."
          xcodegen generate
          echo "✅ 工程文件生成完毕"

      - name: 构建模拟器版本
        run: |
          echo "👉 当前 Xcode 版本："
          xcodebuild -version
          
          echo "👉 开始编译（如果报错，下方会出现中文提示）..."
          xcodebuild \
            -project SSHBlack.xcodeproj \
            -scheme SSHBlack \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
            
          if [ $? -eq 0 ]; then
            echo "🎉 构建成功！"
          else
            echo "❌ 构建失败！请截图上面的英文报错发给助手。"
            exit 1
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SSHBlack-模拟器版
          path: build/Build/Products/Release-iphonesimulator/SSHBlack.app
