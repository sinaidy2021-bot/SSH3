name: iOS 构建

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          echo "👉 生成 Xcode 工程..."
          xcodegen generate
          echo "✅ 生成完毕"

      - name: 构建模拟器版本
        run: |
          echo "👉 开始编译..."
          set +e
          xcodebuild \
            -project SSHBlack.xcodeproj \
            -scheme SSHBlack \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "🎉 构建成功！"
          else
            echo "========================================"
            echo "❌ 构建失败！以下是日志末尾的 100 行报错："
            echo "========================================"
            tail -n 100 build_log.txt
            exit 1
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SSHBlack-模拟器版
          path: build/Build/Products/Release-iphonesimulator/SSHBlack.app
