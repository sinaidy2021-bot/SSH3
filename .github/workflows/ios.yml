name: iOS 构建

on:
  workflow_dispatch:  # 只有你手动点按钮才会构建

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          echo "👉 正在生成 Xcode 工程文件..."
          xcodegen generate
          echo "✅ 工程文件生成完毕"

      - name: 构建模拟器版本
        run: |
          echo "👉 当前 Xcode 版本："
          xcodebuild -version
          
          echo "👉 开始编译..."
          
          set +e
          
          xcodebuild \
            -project SSHBlack.xcodeproj \
            -scheme SSHBlack \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build_log.txt
          
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "🎉 构建成功！"
          else
            # 计算报错条数
            ERROR_COUNT=$(grep -c "error:" build_log.txt)
            echo "========================================"
            echo "🔍 共发现 ${ERROR_COUNT} 条报错，逐条列出（含上下文和建议方案）"
            echo "========================================"
            echo ""
            
            # 逐条提取并排版报错
            grep -n "error:" build_log.txt | while IFS= read -r line; do
              LINE_NUM=$(echo "$line" | cut -d: -f1)
              ERROR_MSG=$(echo "$line" | cut -d: -f2-)
              
              echo "----------------------------------------"
              echo "📍 报错内容："
              echo "$ERROR_MSG"
              echo ""
              echo "上下文（原始日志第 ${LINE_NUM} 行附近）："
              START=$((LINE_NUM - 3))
              END=$((LINE_NUM + 3))
              sed -n "${START},${END}p" build_log.txt | sed 's/^/    /'
              echo ""
              echo "💡 建议：把这条报错完整内容发给我，我可以帮你定位具体是哪一行代码的问题。"
              echo ""
            done
            
            # 如果还有 BUILD FAILED 也提取出来
            if grep -q "BUILD FAILED" build_log.txt; then
              echo "----------------------------------------"
              echo "📍 报错内容："
              echo "** BUILD FAILED **"
              echo ""
              echo "上下文（原始日志末尾附近）："
              tail -n 5 build_log.txt | sed 's/^/    /'
              echo ""
              echo "💡 建议：把这条报错完整内容发给我，我可以帮你定位具体是哪一行代码的问题。"
              echo ""
            fi
            
            exit 1
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SSHBlack-模拟器版
          path: build/Build/Products/Release-iphonesimulator/SSHBlack.app
