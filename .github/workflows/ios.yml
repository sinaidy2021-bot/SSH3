name: iOS 构建

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: 下载 Sarasa Mono SC（中英文等宽字体）
        run: |
          set -e
          mkdir -p Sources/SSHBlack/Fonts
          echo "👉 安装 p7zip..."
          brew install p7zip || brew install sevenzip
          echo "👉 下载 Sarasa Mono SC 字体包..."
          curl -fL -o /tmp/sarasa.7z \
            "https://github.com/be5invis/Sarasa-Gothic/releases/download/v1.0.29/SarasaMonoSC-TTF-1.0.29.7z"
          echo "👉 下载完成，大小："
          ls -la /tmp/sarasa.7z
          echo "👉 解压..."
          7z x /tmp/sarasa.7z -o/tmp/sarasa/ -y > /dev/null
          echo "👉 查找 Regular 字体文件..."
          find /tmp/sarasa -name "SarasaMonoSC-Regular.ttf" -exec cp {} Sources/SSHBlack/Fonts/ \;
          echo "👉 字体文件列表："
          ls -la Sources/SSHBlack/Fonts/
          if [ ! -f Sources/SSHBlack/Fonts/SarasaMonoSC-Regular.ttf ]; then
            echo "❌ 字体文件未找到，列出解压目录内容排查："
            find /tmp/sarasa -name "*.ttf" | head -n 20
            exit 1
          fi

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          echo "👉 生成 Xcode 工程..."
          xcodegen generate
          echo "✅ 生成完毕"

      - name: 构建真机 IPA
        run: |
          echo "👉 开始编译..."
          set +e
          xcodebuild archive \
            -project SSHBlack.xcodeproj \
            -scheme SSHBlack \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SSHBlack.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -skipPackagePluginValidation -skipMacroValidation > build_log.txt 2>&1
          CODE=$?
          set -e

          if [ $CODE -eq 0 ]; then
            echo "🎉 编译成功"
          else
            echo "========================================"
            echo "❌ 编译失败！以下是错误摘要（含上下文）"
            echo "========================================"
            grep -n -B 3 -A 3 "error:" build_log.txt | tail -n 120
            echo "========================================"
            exit 1
          fi

          echo "✅ 打包 Payload..."
          mkdir -p build/Payload
          cp -R build/SSHBlack.xcarchive/Products/Applications/SSHBlack.app build/Payload/
          cd build && zip -r SSHBlack-unsigned.ipa Payload
          echo "🎉 IPA 打包完成"

      - uses: actions/upload-artifact@v4
        with:
          name: SSHBlack-未签名IPA
          path: build/SSHBlack-unsigned.ipa
