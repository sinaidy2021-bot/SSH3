name: iOS 构建

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          echo "👉 生成 Xcode 工程..."
          xcodegen generate
          echo "✅ 生成完毕"

      - name: 构建并打包未签名 IPA
        run: |
          echo "👉 开始编译真机版本..."
          
          set +e
          # 编译真机架构，强制忽略代码签名
          xcodebuild archive \
            -project SSHBlack.xcodeproj \
            -scheme SSHBlack \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SSHBlack.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -skipPackagePluginValidation \
            -skipMacroValidation > build_log.txt 2>&1
          EXIT_CODE=$?
          set -e
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "========================================"
            echo "❌ 编译失败！以下是错误摘要："
            echo "========================================"
            grep -n -B 5 -A 5 "error:" build_log.txt | tail -n 100
            exit 1
          fi

          echo "✅ 编译成功，正在打包 Payload..."
          mkdir -p build/Payload
          cp -R build/SSHBlack.xcarchive/Products/Applications/SSHBlack.app build/Payload/
          
          cd build
          zip -r SSHBlack-unsigned.ipa Payload
          echo "🎉 未签名 IPA 打包完成！"

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: SSHBlack-未签名IPA
          path: build/SSHBlack-unsigned.ipa
