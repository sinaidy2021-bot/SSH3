name: Build iOS IPA
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build
        run: |
          set +e
          set -o pipefail
          xcodebuild -project MySSH.xcodeproj -target MySSH -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log
          echo "" | tee -a build.log
          echo "========================================" | tee -a build.log
          echo "🔍 共发现 $(grep -c "error:" build.log) 条报错，逐条列出（含上下文和建议方案）" | tee -a build.log
          echo "========================================" | tee -a build.log
          grep -n "error:" build.log | head -20 | while read line; do
            echo "" | tee -a build.log
            echo "----------------------------------------" | tee -a build.log
            echo "📍 报错内容：" | tee -a build.log
            echo "$line" | tee -a build.log
            echo "" | tee -a build.log
            echo "💡 建议：把这条报错完整内容发给我，我可以帮你定位具体是哪一行代码的问题。" | tee -a build.log
          done
          echo "" | tee -a build.log
          if grep -q "BUILD FAILED" build.log; then
            echo "** BUILD FAILED **" | tee -a build.log
            exit 1
          fi
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/MySSH.app Payload/
          zip -r MySSH.ipa Payload
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-中文日记
          path: build.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MySSH-ipa
          path: MySSH.ipa
