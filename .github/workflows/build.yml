name: Build iOS IPA
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project MySSH.xcodeproj -scheme MySSH -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log
          mkdir -p Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "MySSH.app" -type d | head -n 1)
          echo "APP at $APP_PATH" | tee -a build.log
          cp -r "$APP_PATH" Payload/
          rm -rf Payload/MySSH.app/_CodeSignature || true
          zip -qr MySSH.ipa Payload -x "*.DS_Store"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-中文日记
          path: build.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MySSH-ipa
          path: MySSH.ipa
