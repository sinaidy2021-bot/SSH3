name: Build iOS IPA
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-17
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project MySSH.xcodeproj -scheme MySSH -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/MySSH.app Payload/
          zip -r MySSH.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MySSH-ipa
          path: MySSH.ipa
