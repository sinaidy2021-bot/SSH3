name: SSHBlack

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: "2.65.0"
  swift-nio-ssh:
    url: https://github.com/apple/swift-nio-ssh.git
    from: "0.15.0"
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: "1.2.0"   # 👈 修复：必须用 exactVersion，不能用 exact

targets:
  SSHBlack:
    type: application
    platform: iOS
    sources:
      - Sources/SSHBlack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sshblack
        PRODUCT_NAME: SSHBlack
        SWIFT_VERSION: "5.9"
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "SSH Black"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIStatusBarStyle: "UIStatusBarStyleLightContent"
        INFOPLIST_KEY_UIUserInterfaceStyle: "Dark"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: SwiftTerm
        product: SwiftTerm

schemes:
  SSHBlack:
    build:
      targets:
        SSHBlack: all
    run:
      config: Debug
    archive:
      config: Release
