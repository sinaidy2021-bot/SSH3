name: MySSH
options:
  bundleIdPrefix: com.myssh
targets:
  MySSH:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [MySSH]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myssh.app
        INFOPLIST_FILE: MySSH/Info.plist
    dependencies:
      - package: Citadel
      - package: NIOSSH
      - package: NIO
packages:
  Citadel: { url: https://github.com/orlandos-nl/Citadel, from: "0.9.0" }
  NIOSSH: { url: https://github.com/apple/swift-nio-ssh, from: "0.8.0" }
  NIO: { url: https://github.com/apple/swift-nio, from: "2.70.0" }
